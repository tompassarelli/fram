name: ci

on:
  push:
  pull_request:

# The occurrence-native manifest is exhaustive: every Clojure test is either a
# current gate or an explicit pre-cutover hold. New tests fail CI until classified.

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BEAGLE_HOME: ${{ github.workspace }}/.beagle
      FRAM_BEAGLE: ${{ github.workspace }}/.beagle/bin/beagle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The catalog currency gate (catalog_current_test.clj) diffs the GENERATED beagle
      # fram-API catalog (stdlib-fram.rkt) against fram's source — checkout beagle to enable it.
      - name: Checkout beagle (for the stdlib-fram.rkt currency gate)
        uses: actions/checkout@v4
        with:
          repository: Autonymy/beagle
          path: .beagle

      - name: Install Racket (Beagle graph-authoring runtime)
        uses: Bogdanp/setup-racket@v1.14
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.1'

      - name: Link checked-out Beagle packages with pinned Racket
        run: |
          export _BEAGLE_RACKET="$(command -v racket)"
          export _BEAGLE_ZO_CHECKED=1
          # Package linking owns collection resolution in this step.
          export _BEAGLE_SCOPE_ROOT="$BEAGLE_HOME"
          source "$BEAGLE_HOME/bin/_beagle-racket"
          "$RACO" pkg install --auto --link \
            "$BEAGLE_HOME/beagle-lib/" \
            "$BEAGLE_HOME/beagle-test/" \
            "$BEAGLE_HOME/beagle/"
          echo "FRAM_RACKET=$RACKET" >> "$GITHUB_ENV"
          echo "_BEAGLE_RACKET=$RACKET" >> "$GITHUB_ENV"

      - name: Install babashka
        run: curl -sL https://raw.githubusercontent.com/babashka/babashka/master/install | sudo bash

      # The coordinator daemon (bin/fram-daemon) and the mTLS test run on the JVM,
      # not bb — bb's native image lacks javax.net.ssl.SSLServerSocket. ubuntu-latest
      # ships a JDK (keytool, which tls_test uses); we add the Clojure CLI on top.
      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh
          clojure --version

      - name: Warm JVM deps (cheshire) so the daemon boots fast
        run: clojure -P

      - name: Occurrence-native component and boundary suites
        env:
          BEAGLE: ${{ github.workspace }}/.beagle
        run: |
          set -uo pipefail
          manifest=tests/occurrence_native_ci_manifest.txt
          manifest_scratch="$(mktemp -d)"
          trap 'rm -rf "${manifest_scratch:?}"' EXIT INT TERM

          rg --files tests -g '*_test.clj' | sort > "$manifest_scratch/actual"
          awk '$1 == "run" || $1 == "legacy" {print $2}' "$manifest" \
            | sort > "$manifest_scratch/declared"
          if [ -s "$manifest_scratch/declared" ] && \
             [ -n "$(uniq -d "$manifest_scratch/declared")" ]; then
            echo "duplicate Clojure test disposition in $manifest" >&2
            uniq -d "$manifest_scratch/declared" >&2
            exit 1
          fi
          if ! diff -u "$manifest_scratch/actual" "$manifest_scratch/declared"; then
            echo "classify every tests/*_test.clj entry as run or legacy" >&2
            exit 1
          fi

          fail=0
          while read -r disposition test_path; do
            case "$disposition" in
              ''|'#') continue ;;
              run)
                echo "== $test_path =="
                env -u FRAM_TELEMETRY_LOG \
                  timeout --signal=TERM --kill-after=10s 240s \
                  bb -cp out "$test_path" || fail=1
                ;;
              run-shell)
                echo "== $test_path =="
                env -u FRAM_TELEMETRY_LOG \
                  timeout --signal=TERM --kill-after=10s 240s \
                  bash "$test_path" || fail=1
                ;;
              run-node)
                echo "== $test_path =="
                timeout --signal=TERM --kill-after=10s 240s \
                  node "$test_path" || fail=1
                ;;
              legacy|legacy-gate)
                [ -f "$test_path" ] || {
                  echo "missing inventoried legacy gate: $test_path" >&2
                  fail=1
                }
                ;;
              *)
                echo "unknown manifest disposition: $disposition" >&2
                fail=1
                ;;
            esac
          done < "$manifest"

          echo "current Clojure gates: $(awk '$1 == "run" {n++} END {print n+0}' "$manifest")"
          echo "inventoried legacy Clojure suites: $(awk '$1 == "legacy" {n++} END {print n+0}' "$manifest")"
          exit $fail
