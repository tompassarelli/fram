name: ci

on:
  push:
  pull_request:

# The occurrence-native manifest is exhaustive: every Clojure test is either a
# current gate, an exact known-failure baseline, or an evidence-backed exclusion.

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BEAGLE_HOME: ${{ github.workspace }}/.beagle
      FRAM_BEAGLE: ${{ github.workspace }}/.beagle/bin/beagle
      FRAM_SERVER_RUNTIME: jvm-dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout beagle (the toolchain FRAM_BEAGLE and the Racket link step use)
        uses: actions/checkout@v4
        with:
          repository: Autonymy/beagle
          # Pin matches flake.nix's beagle.url rev; keep them in sync.
          ref: b7662922b8fb5eb65c5d64a5addd352e90a75519
          path: .beagle

      - name: Install Racket (Beagle graph-authoring runtime)
        uses: Bogdanp/setup-racket@v1.14
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.1'

      - name: Link checked-out Beagle packages with pinned Racket
        run: |
          _BEAGLE_RACKET="$(command -v racket)"
          export _BEAGLE_RACKET
          # Link first: sourcing _beagle-racket runs a raco-make gate that
          # cannot resolve the beagle collection until these links exist.
          "$(dirname "$_BEAGLE_RACKET")/raco" pkg install --auto --link \
            "$BEAGLE_HOME/beagle-lib/" \
            "$BEAGLE_HOME/beagle-test/" \
            "$BEAGLE_HOME/beagle/"
          source "$BEAGLE_HOME/bin/_beagle-racket"
          echo "FRAM_RACKET=$RACKET" >> "$GITHUB_ENV"
          echo "_BEAGLE_RACKET=$RACKET" >> "$GITHUB_ENV"

      - name: Install babashka
        run: curl -sL https://raw.githubusercontent.com/babashka/babashka/master/install | sudo bash

      # The boundary-gate step drives its manifest and evidence checks with rg,
      # which ubuntu-latest does not ship.
      - name: Install ripgrep
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      # CI selects the checkout-only JVM development route until the complete
      # native server artifact is linkable. The mTLS test also needs the JDK.
      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh
          clojure --version

      - name: Warm JVM deps (cheshire) so the server boots fast
        run: clojure -P

      - name: Install pinned Bun for the official client gates
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Verify pinned Bun
        run: test "$(bun --version)" = "1.3.13"

      - name: Occurrence-native component and boundary suites
        run: |
          set -uo pipefail
          manifest=tests/occurrence_native_ci_manifest.txt
          pristine_failures=tests/occurrence_native_ci_failures.txt
          hosted_test=tests/run_hosted_test.sh
          manifest_scratch="$(mktemp -d)"
          trap 'rm -rf "${manifest_scratch:?}"' EXIT INT TERM

          if ! awk -F '\t' '
            /^[[:space:]]*$/ || /^#/ { next }
            NF != 4 {
              printf "%s:%d: expected four tab-separated fields, got %d\n", FILENAME, FNR, NF > "/dev/stderr"
              invalid = 1
            }
            END { exit invalid }
          ' "$manifest"; then
            exit 1
          fi

          rg --files tests -g '*_test.clj' | sort > "$manifest_scratch/actual"
          awk -F '\t' \
            '$1 ~ /^(run-bb|run-clojure|baseline-bb|exclude)$/ {print $3}' \
            "$manifest" \
            | sort > "$manifest_scratch/declared"
          uniq -d "$manifest_scratch/declared" > "$manifest_scratch/duplicates"
          if [ -s "$manifest_scratch/duplicates" ]; then
            echo "duplicate Clojure test disposition in $manifest" >&2
            sed 's/^/  /' "$manifest_scratch/duplicates" >&2
            exit 1
          fi
          if ! diff -u "$manifest_scratch/actual" "$manifest_scratch/declared"; then
            echo "classify every tests/*_test.clj entry in $manifest" >&2
            exit 1
          fi

          : > "$manifest_scratch/actual-failures"
          fail=0
          baseline_index=0
          while IFS=$'\t' read -r disposition class test_path evidence; do
            case "$disposition" in
              ''|'#'*) continue ;;
            esac

            if [ ! -f "$test_path" ]; then
              echo "missing inventoried path: $test_path" >&2
              fail=1
              continue
            fi

            evidence_file=""
            evidence_regex=""
            case "$disposition" in
              exclude|exclude-gate|exclude-runner|aggregate-nix|baseline-bb|baseline-shell)
                if [[ "$evidence" != *'#'* ]]; then
                  echo "$test_path: evidence must be file#regex" >&2
                  fail=1
                  continue
                fi
                evidence_file="${evidence%%#*}"
                evidence_regex="${evidence#*#}"
                if [ ! -f "$evidence_file" ] || [ -z "$evidence_regex" ]; then
                  echo "$test_path: invalid evidence $evidence" >&2
                  fail=1
                  continue
                fi
                ;;
            esac

            case "$disposition" in
              exclude|exclude-gate|exclude-runner|aggregate-nix)
                if ! rg -q -- "$evidence_regex" "$evidence_file"; then
                  echo "$test_path: evidence not found in $evidence_file: $evidence_regex" >&2
                  fail=1
                fi
                ;;
            esac

            case "$disposition" in
              run-bb)
                echo "== $test_path =="
                "$hosted_test" 240s env -u FRAM_TELEMETRY_LOG \
                  bb -cp out "$test_path" || fail=1
                ;;
              run-clojure)
                echo "== $test_path =="
                "$hosted_test" 240s env -u FRAM_TELEMETRY_LOG \
                  clojure -M "$test_path" || fail=1
                ;;
              run-shell)
                echo "== $test_path =="
                "$hosted_test" 240s env -u FRAM_TELEMETRY_LOG \
                  bash "$test_path" || fail=1
                ;;
              run-node)
                echo "== $test_path =="
                "$hosted_test" 240s \
                  node "$test_path" || fail=1
                ;;
              run-bun)
                echo "== $test_path =="
                "$hosted_test" 240s \
                  bun test "$test_path" || fail=1
                ;;
              baseline-bb)
                baseline_index=$((baseline_index + 1))
                baseline_output="$manifest_scratch/baseline-$baseline_index.out"
                echo "== $test_path (known-failure baseline: $class) =="
                if "$hosted_test" 240s env -u FRAM_TELEMETRY_LOG \
                    bb -cp out "$test_path" > "$baseline_output" 2>&1; then
                  :
                elif rg -q -- "$evidence_regex" "$baseline_output"; then
                  printf '%s\t%s\n' "$class" "$class" \
                    >> "$manifest_scratch/actual-failures"
                else
                  echo "$test_path failed outside its recorded baseline" >&2
                  sed 's/^/  /' "$baseline_output" >&2
                  fail=1
                fi
                ;;
              baseline-shell)
                baseline_index=$((baseline_index + 1))
                baseline_output="$manifest_scratch/baseline-$baseline_index.out"
                echo "== $test_path (known-failure baseline: $class) =="
                if "$hosted_test" 240s env -u FRAM_TELEMETRY_LOG \
                    bash "$test_path" > "$baseline_output" 2>&1; then
                  :
                else
                  sed -n 's/^  REGROWTH  \([^:]*\):.*/vocab-residue\t\1/p' \
                    "$baseline_output" >> "$manifest_scratch/actual-failures"
                  if ! rg -q -- "$evidence_regex" "$baseline_output"; then
                    echo "$test_path failed outside its recorded baseline" >&2
                    sed 's/^/  /' "$baseline_output" >&2
                    fail=1
                  fi
                fi
                ;;
              aggregate-nix)
                echo "== $test_path (current $class aggregate; toolchain-owned) =="
                ;;
              exclude-runner)
                echo "== $test_path (current gate, not run here: $class) =="
                ;;
              exclude|exclude-gate)
                ;;
              *)
                echo "unknown manifest disposition: $disposition" >&2
                fail=1
                ;;
            esac
          done < "$manifest"

          sort -u "$manifest_scratch/actual-failures" \
            > "$manifest_scratch/actual-failures.sorted"
          awk -F '\t' '!/^[[:space:]]*$/ && !/^#/ {print $1 "\t" $2}' \
            "$pristine_failures" | sort -u \
            > "$manifest_scratch/pristine-failures.sorted"
          if ! bash tests/occurrence_native_ci_compare.sh \
              "$manifest_scratch/pristine-failures.sorted" \
              "$manifest_scratch/actual-failures.sorted"; then
            echo "known failure contract changed; repair it or update the pristine baseline" >&2
            fail=1
          fi

          echo "direct current gates: $(awk -F '\t' '$1 ~ /^run-/ {n++} END {print n+0}' "$manifest")"
          echo "known-failure baselines: $(awk -F '\t' '$1 ~ /^baseline-/ {n++} END {print n+0}' "$manifest")"
          echo "evidence-backed Clojure exclusions: $(awk -F '\t' '$1 == "exclude" {n++} END {print n+0}' "$manifest")"
          echo "runner-capacity exclusions: $(awk -F '\t' '$1 == "exclude-runner" {n++} END {print n+0}' "$manifest")"
          exit $fail
