name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semver tag to publish (for example, v0.4.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: fram-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  # The full native server is built in publish with the pinned Beagle checkout
  # and musl compiler. This job gates the bb suite, cc-only smokes, and both
  # cross-workdir normalized release receipts before any release can exist.
  gate:
    name: Gate the tag, smokes, and reproducible release receipts
    runs-on: ubuntu-latest
    env:
      BEAGLE_HOME: ${{ github.workspace }}/.beagle
      FRAM_BEAGLE: ${{ github.workspace }}/.beagle/bin/beagle
      FRAM_SERVER_RUNTIME: jvm-dev
    steps:
      - name: Check out the requested release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          fetch-depth: 0

      - name: Bind this gate to the immutable release commit
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release tag must be vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 2
          }
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]] || {
            echo "checked-out source is not the requested tag commit" >&2
            exit 1
          }

      # native_code_reader_test.clj and projection_lifecycle_test.clj ingest
      # real Beagle sources, so the run-bb suite needs the same Beagle and
      # Racket that .github/workflows/ci.yml installs.
      - name: Checkout beagle
        uses: actions/checkout@v4
        with:
          repository: Autonymy/beagle
          # Pin matches flake.nix's beagle.url rev; keep them in sync.
          ref: b7662922b8fb5eb65c5d64a5addd352e90a75519
          path: .beagle

      - name: Install Racket (Beagle graph-authoring runtime)
        uses: Bogdanp/setup-racket@v1.14
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.1'

      - name: Link checked-out Beagle packages with pinned Racket
        run: |
          _BEAGLE_RACKET="$(command -v racket)"
          export _BEAGLE_RACKET
          # Link first: sourcing _beagle-racket runs a raco-make gate that
          # cannot resolve the beagle collection until these links exist.
          "$(dirname "$_BEAGLE_RACKET")/raco" pkg install --auto --link \
            "$BEAGLE_HOME/beagle-lib/" \
            "$BEAGLE_HOME/beagle-test/" \
            "$BEAGLE_HOME/beagle/"
          source "$BEAGLE_HOME/bin/_beagle-racket"
          echo "FRAM_RACKET=$RACKET" >> "$GITHUB_ENV"
          echo "_BEAGLE_RACKET=$RACKET" >> "$GITHUB_ENV"

      - name: Install babashka
        run: curl -sL https://raw.githubusercontent.com/babashka/babashka/master/install | sudo bash

      - name: Install Clojure CLI
        run: |
          curl -L -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh
          clojure --version

      - name: Warm JVM deps (cheshire) so the server boots fast
        run: clojure -P

      - name: Install pinned Bun for the client release gate
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Verify pinned Bun
        run: test "$(bun --version)" = "1.3.13"

      - name: Prove the Bun release package and declaration closure
        run: |
          bash tests/bun_release_artifact_test.sh
          bun test tests/bun_package_types_test.mjs

      - name: Install static musl compiler for the release receipt gate
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Prove the normalized native release is cross-workdir reproducible
        env:
          CC: musl-gcc
        run: bash tests/native_release_artifact_test.sh

      - name: Occurrence-native run-bb suite and native cache/adapter smokes
        env:
          BEAGLE: ${{ github.workspace }}/.beagle
        run: |
          set -uo pipefail
          manifest=tests/occurrence_native_ci_manifest.txt
          hosted_test=tests/run_hosted_test.sh
          # Named, not scanned: these two are the release-relevant run-shell
          # gates that need nothing past the runner's own cc.
          smokes=(
            tests/fram_native_build_cache_smoke.sh
            tests/fram_native_generated_adapter_smoke.sh
          )

          fail=0
          gates=0
          while IFS=$'\t' read -r disposition _class test_path _evidence; do
            [ "$disposition" = "run-bb" ] || continue
            if [ ! -f "$test_path" ]; then
              echo "missing inventoried path: $test_path" >&2
              fail=1
              continue
            fi
            gates=$((gates + 1))
            echo "== $test_path =="
            "$hosted_test" 240s env -u FRAM_TELEMETRY_LOG \
              bb -cp out "$test_path" || fail=1
          done < "$manifest"

          for smoke in "${smokes[@]}"; do
            if ! awk -F '\t' -v path="$smoke" \
                '$1 == "run-shell" && $3 == path { found = 1 }
                 END { exit !found }' "$manifest"; then
              echo "$smoke is no longer a run-shell gate in $manifest" >&2
              fail=1
              continue
            fi
            gates=$((gates + 1))
            echo "== $smoke =="
            "$hosted_test" 600s env -u FRAM_TELEMETRY_LOG \
              bash "$smoke" || fail=1
          done

          echo "release gates run: $gates"
          exit $fail

  publish:
    name: Publish the tagged release
    needs: gate
    runs-on: ubuntu-latest
    env:
      BEAGLE_HOME: ${{ github.workspace }}/.beagle
      FRAM_BEAGLE: ${{ github.workspace }}/.beagle/bin/beagle
    steps:
      - name: Check out the requested release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          fetch-depth: 0

      - name: Bind this run to one immutable release commit
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release tag must be vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 2
          }
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          [[ "$head_commit" == "$tag_commit" ]] || {
            echo "checked-out source is not the requested tag commit" >&2
            exit 1
          }
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Checkout Beagle at FRAM's pinned native compiler revision
        uses: actions/checkout@v4
        with:
          repository: Autonymy/beagle
          # Pin matches flake.nix's beagle.url rev; keep them in sync.
          ref: b7662922b8fb5eb65c5d64a5addd352e90a75519
          path: .beagle

      - name: Install Racket for the pinned Beagle compiler
        uses: Bogdanp/setup-racket@v1.14
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.1'

      - name: Link the checked-out Beagle packages
        run: |
          _BEAGLE_RACKET="$(command -v racket)"
          export _BEAGLE_RACKET
          "$(dirname "$_BEAGLE_RACKET")/raco" pkg install --auto --link \
            "$BEAGLE_HOME/beagle-lib/" \
            "$BEAGLE_HOME/beagle-test/" \
            "$BEAGLE_HOME/beagle/"
          source "$BEAGLE_HOME/bin/_beagle-racket"
          echo "FRAM_RACKET=$RACKET" >> "$GITHUB_ENV"
          echo "_BEAGLE_RACKET=$RACKET" >> "$GITHUB_ENV"

      - name: Install the static musl release compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Install pinned Bun for the client artifact and shipped FRAMRPC smoke
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Verify pinned Bun
        run: test "$(bun --version)" = "1.3.13"

      - name: Build twice and seal the reproducible Bun client package
        id: bun_client
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          mapfile -t package_files < <(
            scripts/package-bun-release.sh \
              --source-root "$GITHUB_WORKSPACE" \
              --output "$RUNNER_TEMP/fram-bun-release" \
              --version "$RELEASE_TAG"
          )
          [[ "${#package_files[@]}" == 2 ]] || {
            echo "Bun release packager returned ${#package_files[@]} paths" >&2
            exit 1
          }

          second_source="$RUNNER_TEMP/fram-bun-release-source-b"
          git clone --quiet --no-local "$GITHUB_WORKSPACE" "$second_source"
          git -C "$second_source" checkout --quiet --detach "$RELEASE_COMMIT"
          mapfile -t second_package_files < <(
            scripts/package-bun-release.sh \
              --source-root "$second_source" \
              --output "$RUNNER_TEMP/fram-bun-release-b" \
              --version "$RELEASE_TAG"
          )
          [[ "${#second_package_files[@]}" == 2 ]] || {
            echo "second Bun release packager returned ${#second_package_files[@]} paths" >&2
            exit 1
          }
          cmp -s "${package_files[0]}" "${second_package_files[0]}" || {
            echo "Bun package archive differs across source workdirs" >&2
            exit 1
          }
          cmp -s "${package_files[1]}" "${second_package_files[1]}" || {
            echo "Bun package receipt differs across source workdirs" >&2
            exit 1
          }
          grep -Fxq "source-commit $RELEASE_COMMIT" "${package_files[1]}" || {
            echo "Bun package receipt is not bound to $RELEASE_COMMIT" >&2
            exit 1
          }
          echo "archive=${package_files[0]}" >> "$GITHUB_OUTPUT"
          echo "receipt=${package_files[1]}" >> "$GITHUB_OUTPUT"

      - name: Build twice and seal the reproducible native release archive
        id: native
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          build_native() {
            local source_root="$1" cache_root="$2"
            local -a sources
            mapfile -t sources < <(
              sed "s#^#$source_root/#" "$source_root/native/core_closure_sources.txt"
            )
            [[ "${#sources[@]}" -gt 0 ]] || {
              echo "$source_root/native/core_closure_sources.txt is empty" >&2
              return 1
            }
            FRAM_NATIVE_CC="$(command -v musl-gcc)" \
              FRAM_NATIVE_STATIC=1 \
              FRAM_NATIVE_CACHE="$cache_root" \
              "$source_root/bin/fram-native-build" --host server "${sources[@]}"
          }

          artifact="$(build_native "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/fram-native-release-cache-a")"
          mapfile -t release_files < <(
            scripts/package-native-release.sh \
              --source-root "$GITHUB_WORKSPACE" \
              --artifact "$artifact" \
              --output "$RUNNER_TEMP/fram-native-release" \
              --version "$RELEASE_TAG" \
              --target x86_64-linux-musl
          )
          [[ "${#release_files[@]}" == 2 ]] || {
            echo "native release packager returned ${#release_files[@]} paths" >&2
            exit 1
          }

          second_source="$RUNNER_TEMP/fram-native-release-source-b"
          git clone --quiet --no-local "$GITHUB_WORKSPACE" "$second_source"
          git -C "$second_source" checkout --quiet --detach "$RELEASE_COMMIT"
          second_artifact="$(build_native "$second_source" \
            "$RUNNER_TEMP/fram-native-release-cache-b")"
          mapfile -t second_release_files < <(
            scripts/package-native-release.sh \
              --source-root "$second_source" \
              --artifact "$second_artifact" \
              --output "$RUNNER_TEMP/fram-native-release-b" \
              --version "$RELEASE_TAG" \
              --target x86_64-linux-musl
          )
          [[ "${#second_release_files[@]}" == 2 ]] || {
            echo "second native release packager returned ${#second_release_files[@]} paths" >&2
            exit 1
          }
          cmp -s "$artifact/bin/fram-server-native" \
            "$second_artifact/bin/fram-server-native" || {
            echo "native executable differs across source workdirs" >&2
            sha256sum "$artifact/bin/fram-server-native" \
              "$second_artifact/bin/fram-server-native" >&2
            exit 1
          }
          cmp -s "${release_files[0]}" "${second_release_files[0]}" || {
            echo "normalized native archive differs across source workdirs" >&2
            exit 1
          }
          cmp -s "${release_files[1]}" "${second_release_files[1]}" || {
            echo "native release receipt differs across source workdirs" >&2
            exit 1
          }
          grep -Fxq "source-commit $RELEASE_COMMIT" "${release_files[1]}" || {
            echo "native release receipt is not bound to $RELEASE_COMMIT" >&2
            exit 1
          }
          echo "archive=${release_files[0]}" >> "$GITHUB_OUTPUT"
          echo "receipt=${release_files[1]}" >> "$GITHUB_OUTPUT"

      - name: Revalidate and install the shipped Bun package before upload
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          PACKAGE_ARCHIVE: ${{ steps.bun_client.outputs.archive }}
          PACKAGE_RECEIPT: ${{ steps.bun_client.outputs.receipt }}
        run: |
          set -euo pipefail
          [[ "$(wc -l < "$PACKAGE_RECEIPT")" == 9 ]] || {
            echo "Bun package receipt must contain exactly nine lines" >&2
            exit 1
          }
          expected_keys=$'fram-bun-release-receipt/v1\nsource-commit\nsource-date-epoch\nrelease-tag\npackage-name\npackage-version\npackage-json-sha256\narchive-name\narchive-sha256'
          observed_keys="$(awk 'NR == 1 { print; next } { print $1 }' "$PACKAGE_RECEIPT")"
          [[ "$observed_keys" == "$expected_keys" ]] || {
            echo "Bun package receipt schema is not closed or ordered" >&2
            exit 1
          }
          receipt_value() {
            local key="$1"
            awk -v key="$key" '$1 == key && NF == 2 { print $2 }' "$PACKAGE_RECEIPT"
          }
          package_version="$(receipt_value package-version)"
          expected_archive="tompassarelli-framrpc-${package_version}.tgz"
          [[ "$(receipt_value source-commit)" == "$RELEASE_COMMIT" ]]
          [[ "$(receipt_value release-tag)" == "$RELEASE_TAG" ]]
          [[ "$(receipt_value package-name)" == @tompassarelli/framrpc ]]
          [[ "$(receipt_value archive-name)" == "$expected_archive" ]]
          [[ "$(basename "$PACKAGE_ARCHIVE")" == "$expected_archive" ]]
          [[ "$(sha256sum "$PACKAGE_ARCHIVE" | awk '{print $1}')" == \
            "$(receipt_value archive-sha256)" ]] || {
            echo "Bun package archive hash does not match its receipt" >&2
            exit 1
          }

          verify_root="$RUNNER_TEMP/fram-bun-release-upload-verify"
          mkdir -p "$verify_root"
          tar -xzf "$PACKAGE_ARCHIVE" -C "$verify_root"
          [[ "$(sha256sum "$verify_root/package/package.json" | awk '{print $1}')" == \
            "$(receipt_value package-json-sha256)" ]] || {
            echo "packed manifest hash does not match its receipt" >&2
            exit 1
          }

          consumer="$RUNNER_TEMP/fram-bun-release-consumer"
          mkdir -p "$consumer/empty-cache"
          printf '%s\n' \
            '{"name":"framrpc-release-consumer","private":true,"type":"module"}' \
            > "$consumer/package.json"
          (
            cd "$consumer"
            bun add --offline --cache-dir "$consumer/empty-cache" \
              --registry http://127.0.0.1:9 --ignore-scripts --exact \
              "$PACKAGE_ARCHIVE"
            bun -e '
              import assert from "node:assert/strict";
              import { framClient } from "@tompassarelli/framrpc";
              import { schemaClient } from "@tompassarelli/framrpc/schema";
              const client = framClient({ space: "release-package-smoke" });
              assert.equal("raw" in client, false);
              assert.equal("checkpoint" in client, false);
              assert.equal("framNativeCheckpoint" in client, false);
              assert.equal(typeof schemaClient, "function");
            '
          )

      - name: Revalidate and run the shipped executable before upload
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
          RELEASE_ARCHIVE: ${{ steps.native.outputs.archive }}
          RELEASE_RECEIPT: ${{ steps.native.outputs.receipt }}
        run: |
          set -euo pipefail
          expected_root="fram-${RELEASE_TAG}-x86_64-linux-musl"
          expected_executable="$expected_root/bin/fram-server-native"
          expected_archive="$expected_root.tar.gz"
          [[ "$(wc -l < "$RELEASE_RECEIPT")" == 9 ]] || {
            echo "native release receipt must contain exactly nine lines" >&2
            exit 1
          }
          expected_keys=$'fram-native-release-receipt/v1\nsource-commit\nsource-date-epoch\nversion\ntarget\nexecutable-path\nexecutable-sha256\narchive-name\narchive-sha256'
          observed_keys="$(awk 'NR == 1 { print; next } { print $1 }' "$RELEASE_RECEIPT")"
          [[ "$observed_keys" == "$expected_keys" ]] || {
            echo "native release receipt schema is not closed or ordered" >&2
            exit 1
          }
          receipt_value() {
            local key="$1"
            awk -v key="$key" '$1 == key && NF == 2 { print $2 }' "$RELEASE_RECEIPT"
          }
          [[ "$(receipt_value source-commit)" == "$RELEASE_COMMIT" ]]
          [[ "$(receipt_value version)" == "$RELEASE_TAG" ]]
          [[ "$(receipt_value target)" == x86_64-linux-musl ]]
          [[ "$(receipt_value executable-path)" == "$expected_executable" ]]
          [[ "$(receipt_value archive-name)" == "$expected_archive" ]]
          [[ "$(basename "$RELEASE_ARCHIVE")" == "$expected_archive" ]]
          [[ "$(sha256sum "$RELEASE_ARCHIVE" | awk '{print $1}')" == \
            "$(receipt_value archive-sha256)" ]] || {
            echo "release archive hash does not match its receipt" >&2
            exit 1
          }

          verify_root="$RUNNER_TEMP/fram-native-release-upload-verify"
          mkdir -p "$verify_root"
          tar -xzf "$RELEASE_ARCHIVE" -C "$verify_root"
          shipped_server="$verify_root/$expected_executable"
          [[ -f "$shipped_server" && -x "$shipped_server" && ! -L "$shipped_server" ]]
          [[ "$(sha256sum "$shipped_server" | awk '{print $1}')" == \
            "$(receipt_value executable-sha256)" ]] || {
            echo "shipped executable hash does not match its receipt" >&2
            exit 1
          }

          port="$(bun -e '
            const server = Bun.serve({
              hostname: "127.0.0.1",
              port: 0,
              fetch() { return new Response(); },
            });
            console.log(server.port);
            server.stop(true);
          ')"
          smoke_log="$RUNNER_TEMP/fram-native-release-smoke.framlog"
          smoke_output="$RUNNER_TEMP/fram-native-release-smoke.stderr"
          FRAM_BIND=127.0.0.1 "$shipped_server" \
            serve "$port" "$smoke_log" release-smoke \
            >"$smoke_output" 2>&1 &
          smoke_pid=$!
          cleanup_smoke() {
            if kill -0 "$smoke_pid" 2>/dev/null; then
              kill -TERM "$smoke_pid" 2>/dev/null || true
              wait "$smoke_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_smoke EXIT INT TERM
          smoke_ok=0
          for _attempt in $(seq 1 100); do
            if bun -e '
              const [clientPath, portText] = Bun.argv.slice(-2);
              const { framClient } = await import(Bun.pathToFileURL(clientPath).href);
              const response = await framClient({
                host: "127.0.0.1",
                port: Number(portText),
                space: "release-smoke",
                requestTimeoutMs: 1000,
              }).version();
              if (response.operation !== "rpc/version" || response.servedVersion !== 0n) {
                throw new Error("unexpected rpc/version response");
              }
            ' "$GITHUB_WORKSPACE/clients/bun/framrpc.mjs" "$port" \
                >/dev/null 2>&1; then
              smoke_ok=1
              break
            fi
            kill -0 "$smoke_pid" 2>/dev/null || break
            sleep 0.1
          done
          [[ "$smoke_ok" == 1 ]] || {
            echo "shipped executable failed its rpc/version smoke" >&2
            sed -n '1,160p' "$smoke_output" >&2
            exit 1
          }
          kill -TERM "$smoke_pid"
          wait "$smoke_pid"
          trap - EXIT INT TERM

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --target "$RELEASE_COMMIT" --title "$RELEASE_TAG" --generate-notes \
            "${{ steps.bun_client.outputs.archive }}" \
            "${{ steps.bun_client.outputs.receipt }}" \
            "${{ steps.native.outputs.archive }}" \
            "${{ steps.native.outputs.receipt }}"
